<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Aktivasi Izin Mikrofon - Asisten Belajar AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #3730a3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    p {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.55;
      margin: 0 0 24px;
    }
    .btn-allow {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
    }
    .btn-allow:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-allow:active {
      transform: translateY(0);
    }
    .status-msg {
      margin-top: 16px;
      font-size: 12.5px;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🎙️</div>
    <h1>Aktifkan Izin Mikrofon</h1>
    <p>
      Browser Google Chrome membutuhkan izin satu kali agar ekstensi dapat merekam suara mikrofon Anda.
      <br><br>
      Silakan klik tombol di bawah, lalu pilih <b>"Allow"</b> (Izinkan) pada jendela konfirmasi browser.
    </p>

    <button id="btnGrant" class="btn-allow">
      <span>🎙️ Izinkan Akses Mikrofon</span>
    </button>

    <div id="statusBox" class="status-msg"></div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
